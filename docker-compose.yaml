name: wagering

services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_USER: wagering_owner # dono do schema; usado só pelas migrations
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: wagering
      TZ: UTC
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - max_connections=200 # 3 instâncias + pools dos testes
      - -c
      - log_lock_waits=on # loga quem esperou lock além do deadlock_timeout
      - -c
      - deadlock_timeout=500ms
      - -c
      - log_min_duration_statement=200 # loga queries lentas (> 200 ms)
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering_owner -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 10s

  localstack:
    image: localstack/localstack:3.8 # versão fixa (ver observação abaixo)
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: "1" # sobe o SQS já no boot
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      # só fica healthy quando a ÚLTIMA fila do script existir
      test:
        [
          "CMD-SHELL",
          "awslocal sqs get-queue-url --queue-name wallet-events.fifo > /dev/null 2>&1",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  pgdata:
